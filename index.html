<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriScan">
<meta name="description" content="NutriScan — Eat smart. Live better. Fotografía tu plato y conoce sus nutrientes aproximados con IA.">
<title>NutriScan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F3F5EF; --bg-2:#E9EEE4; --surface:#FFFFFF; --surface-2:#F7F9F4;
  --ink:#0E1A14; --ink-2:#2B3A31; --muted:#6B7A70; --line:#E2E8DD;
  --forest:#0F3B2C; --forest-2:#1A5A42; --lime:#C8F169; --lime-2:#A9DD34; --on-lime:#0F3B2C;
  --c-protein:#1F7A57; --c-carbs:#9CCB2C; --c-fat:#F0B13D; --c-fiber:#2FA39B; --c-water:#4C9BF0; --c-kcal:#0F3B2C;
  --danger:#C8473A; --warn:#B7791F;
  --hero-bg:#0F3B2C; --hero-ink:#F2F8EE; --hero-muted:#A8C2B3; --hero-track:rgba(255,255,255,.12);
  --shadow:0 1px 2px rgba(15,59,44,.05), 0 8px 24px -12px rgba(15,59,44,.18);
  --shadow-lg:0 24px 60px -20px rgba(15,59,44,.35);
  --r:22px; --r-sm:14px;
  --nav-h:76px;
  --safe-b:max(env(safe-area-inset-bottom,0px), var(--safe-area-inset-bottom,0px)); --safe-t:max(env(safe-area-inset-top,0px), var(--safe-area-inset-top,0px));
  --font-d:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --font:"Manrope", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A110D; --bg-2:#101A14; --surface:#131E18; --surface-2:#18251E;
    --ink:#EAF2EA; --ink-2:#C9D6CC; --muted:#8A9B90; --line:#22322A;
    --forest:#C8F169; --forest-2:#A9DD34; --on-lime:#0F3B2C;
    --c-protein:#4CC28F; --c-kcal:#C8F169;
    --hero-bg:#13261D; --hero-track:rgba(255,255,255,.08);
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A110D; --bg-2:#101A14; --surface:#131E18; --surface-2:#18251E;
  --ink:#EAF2EA; --ink-2:#C9D6CC; --muted:#8A9B90; --line:#22322A;
  --forest:#C8F169; --forest-2:#A9DD34; --on-lime:#0F3B2C;
  --c-protein:#4CC28F; --c-kcal:#C8F169;
  --hero-bg:#13261D; --hero-track:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
img{display:block;max-width:100%}
a{color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
@media (min-width:640px){
  body{background:radial-gradient(1200px 600px at 20% -10%, color-mix(in srgb,var(--lime) 30%, transparent), transparent 60%), var(--bg-2)}
  .app{box-shadow:0 0 0 1px var(--line), var(--shadow-lg);min-height:100dvh}
}
.view{padding:calc(14px + var(--safe-t)) 16px calc(var(--nav-h) + 36px + var(--safe-b));animation:fadeUp .35s cubic-bezier(.2,.7,.2,1)}
.view.no-nav{padding-bottom:calc(28px + var(--safe-b))}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes scanline{0%{top:6%}50%{top:90%}100%{top:6%}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes shimmer{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Tipografía */
h1,h2,h3,.d{font-family:var(--font-d);letter-spacing:-.02em;margin:0}
h1{font-size:28px;font-weight:700;line-height:1.1}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.num{font-family:var(--font-d);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* Estructura */
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.flat{box-shadow:none}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 12px}
.section-title h2{font-size:18px}
.divider{height:1px;background:var(--line);margin:14px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2)}
.pill.lime{background:color-mix(in srgb,var(--lime) 35%, var(--surface));border-color:transparent;color:var(--on-lime)}
.pill.ai{background:color-mix(in srgb,var(--c-fat) 20%, var(--surface));border-color:transparent;color:var(--ink)}
.pill.db{background:color-mix(in srgb,var(--c-protein) 18%, var(--surface));border-color:transparent;color:var(--ink)}

/* Botones */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:16px;font-weight:700;font-size:15px;transition:transform .15s, opacity .15s, background .2s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--forest);color:var(--bg)}
:root[data-theme="dark"] .btn.primary{color:#0F3B2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F3B2C}}
.btn.lime{background:var(--lime);color:var(--on-lime)}
.btn.ghost{background:var(--surface-2);border:1px solid var(--line)}
.btn.danger{background:color-mix(in srgb,var(--danger) 12%, var(--surface));color:var(--danger)}
.btn.block{width:100%}
.btn.sm{height:38px;padding:0 14px;border-radius:12px;font-size:13.5px}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex-shrink:0}
.icon-btn.sm{width:34px;height:34px;border-radius:11px}
.link{color:var(--forest);font-weight:700;font-size:14px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
svg.i.s{width:18px;height:18px}

/* Formularios */
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:6px}
.input,select.input,textarea.input{width:100%;height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);outline:none;transition:border .2s, box-shadow .2s;font-size:16px}
textarea.input{height:auto;min-height:84px;padding:12px 14px;resize:vertical}
.input:focus{border-color:var(--forest-2);box-shadow:0 0 0 4px color-mix(in srgb,var(--lime) 35%, transparent)}
.field{margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;transition:all .15s}
.chip.on{background:var(--forest);border-color:var(--forest);color:var(--bg)}
:root[data-theme="dark"] .chip.on{color:#0F3B2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{color:#0F3B2C}}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13.5px;color:var(--ink-2);cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--forest-2);margin-top:1px;flex-shrink:0}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);padding:4px;border-radius:14px}
.seg button{flex:1;height:36px;border-radius:10px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.switch{position:relative;width:48px;height:28px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--forest-2)}
.switch input:checked+span::after{transform:translateX(20px)}

/* Logo */
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:36px;height:36px}
.logo b{font-family:var(--font-d);font-weight:800;font-size:20px;letter-spacing:-.03em}
.logo b em{font-style:normal;color:var(--c-protein)}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-family:var(--font-d);font-weight:800;font-size:17px}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-head h1{font-size:24px}

/* Hero dashboard */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:28px;padding:22px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero::before{content:"";position:absolute;width:260px;height:260px;right:-90px;top:-110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--lime) 40%, transparent),transparent 65%)}
.hero .muted{color:var(--hero-muted)}
.ring-wrap{position:relative;width:148px;height:148px;flex-shrink:0}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-wrap .track{stroke:var(--hero-track)}
.ring-wrap .prog{stroke:var(--lime);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.7,.2,1)}
.ring-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-center .big{font-size:34px;font-weight:800;line-height:1}
.hero-stats{display:grid;gap:12px;flex:1;min-width:0}
.hero-stats .k{font-size:12px;color:var(--hero-muted);font-weight:600}
.hero-stats .v{font-size:20px;font-weight:700}
.msg-card{display:flex;gap:12px;align-items:flex-start;margin-top:16px;padding:14px;border-radius:18px;background:rgba(255,255,255,.07);position:relative}
.msg-card .spark{width:30px;height:30px;border-radius:10px;background:var(--lime);color:#0F3B2C;display:grid;place-items:center;flex-shrink:0}
.msg-card p{margin:0;font-size:14px;line-height:1.45}

/* CTA escanear */
.scan-cta{margin-top:14px;width:100%;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:24px;background:var(--lime);color:#0F3B2C;box-shadow:0 14px 30px -14px color-mix(in srgb,var(--lime-2) 90%, transparent);position:relative;overflow:hidden;text-align:left}
.scan-cta .ic{width:52px;height:52px;border-radius:16px;background:#0F3B2C;color:var(--lime);display:grid;place-items:center}
.scan-cta b{font-family:var(--font-d);font-size:19px;font-weight:800;letter-spacing:-.01em;display:block}
.scan-cta span{font-size:13px;opacity:.8;font-weight:600}
.scan-cta::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);background-size:200% 100%;animation:shimmer 3.2s infinite linear}

/* Nutrientes */
.nut{display:grid;gap:14px}
.nut-row .top-line{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.nut-row .name{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.bar{height:9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.7,.2,1)}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.tile .v{font-size:22px;font-weight:700;margin-top:4px}

/* Agua */
.water{display:flex;align-items:center;gap:14px}
.glasses{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.glass{width:16px;height:22px;border-radius:3px 3px 6px 6px;border:1.5px solid color-mix(in srgb,var(--c-water) 55%, var(--line));position:relative;overflow:hidden}
.glass.full::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80%;background:var(--c-water);border-radius:0 0 4px 4px;animation:pop .4s}

/* Comidas */
.meal-slot{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left}
.meal-slot .ph{width:56px;height:56px;border-radius:14px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden;flex-shrink:0;color:var(--muted)}
.meal-slot .ph img{width:100%;height:100%;object-fit:cover}
.meal-slot .meta{flex:1;min-width:0}
.meal-slot .meta b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-slot .kc{font-family:var(--font-d);font-weight:700;text-align:right}
.meal-slot.empty{border-style:dashed;background:transparent;box-shadow:none}
.meal-group-title{display:flex;align-items:center;gap:8px;margin:16px 4px 8px;font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}

/* Navegación inferior */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;z-index:40;padding:0 12px calc(10px + var(--safe-b))}
.nav-inner{height:var(--nav-h);background:color-mix(in srgb,var(--surface) 88%, transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:26px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;box-shadow:var(--shadow-lg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em;height:100%;justify-content:center}
.nav button.on{color:var(--ink)}
.nav button.on:not(.scan-btn) svg{stroke:var(--c-protein)}
.ai-badge{background:#0F3B2C!important;color:#C8F169!important}
.nav .scan-btn{position:relative}
.nav .scan-btn .fab{width:64px;height:64px;border-radius:22px;background:var(--forest);color:var(--lime);display:grid;place-items:center;margin-top:-34px;box-shadow:0 14px 28px -10px rgba(15,59,44,.6), 0 0 0 6px var(--bg);transition:transform .2s}
:root[data-theme="dark"] .nav .scan-btn .fab{background:var(--lime);color:#0F3B2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav .scan-btn .fab{background:var(--lime);color:#0F3B2C}}
.nav .scan-btn:active .fab{transform:scale(.92)}
.nav .scan-btn .fab svg{width:28px;height:28px}

/* Escáner */
.finder{position:relative;aspect-ratio:1/.86;border-radius:30px;background:linear-gradient(160deg,var(--forest),#082519);overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow-lg)}
:root[data-theme="dark"] .finder{background:linear-gradient(160deg,#173326,#08130D)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .finder{background:linear-gradient(160deg,#173326,#08130D)}}
.finder img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.finder .corners{position:absolute;inset:22px;pointer-events:none}
.finder .corners i{position:absolute;width:42px;height:42px;border-color:var(--lime);border-style:solid;border-width:0}
.finder .corners i:nth-child(1){top:0;left:0;border-top-width:4px;border-left-width:4px;border-top-left-radius:16px}
.finder .corners i:nth-child(2){top:0;right:0;border-top-width:4px;border-right-width:4px;border-top-right-radius:16px}
.finder .corners i:nth-child(3){bottom:0;left:0;border-bottom-width:4px;border-left-width:4px;border-bottom-left-radius:16px}
.finder .corners i:nth-child(4){bottom:0;right:0;border-bottom-width:4px;border-right-width:4px;border-bottom-right-radius:16px}
.finder .line{position:absolute;left:8%;right:8%;height:3px;border-radius:3px;background:var(--lime);box-shadow:0 0 18px 4px color-mix(in srgb,var(--lime) 70%, transparent);animation:scanline 2.6s ease-in-out infinite}
.finder .plate{width:58%;aspect-ratio:1;border-radius:50%;border:2px dashed rgba(200,241,105,.45);display:grid;place-items:center;color:rgba(200,241,105,.8)}
.finder .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,30,20,.15),rgba(8,30,20,.65))}
.finder .status{position:absolute;left:16px;right:16px;bottom:16px;background:rgba(8,26,18,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#F2F8EE;border-radius:18px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(200,241,105,.25);border-top-color:var(--lime);animation:spin .8s linear infinite;flex-shrink:0}
.steps{display:grid;gap:4px;font-size:13px}
.steps .s{opacity:.4;transition:opacity .3s}
.steps .s.on{opacity:1;font-weight:700}
.steps .s.done{opacity:.75}

/* Resultados */
.result-photo{border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);position:relative}
.result-photo img{width:100%;height:100%;object-fit:cover}
.result-photo .badge{position:absolute;left:12px;top:12px}
.notice{display:flex;gap:10px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--c-fat) 14%, var(--surface));border:1px solid color-mix(in srgb,var(--c-fat) 35%, transparent);font-size:13px;color:var(--ink-2)}
.notice.info{background:color-mix(in srgb,var(--c-water) 10%, var(--surface));border-color:color-mix(in srgb,var(--c-water) 30%, transparent)}
.notice.ok{background:color-mix(in srgb,var(--lime) 22%, var(--surface));border-color:color-mix(in srgb,var(--lime-2) 40%, transparent)}
.notice svg{flex-shrink:0;margin-top:1px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px}
.item .name-in{border:0;background:transparent;font-weight:700;font-size:16px;padding:0;width:100%;outline:none;font-family:var(--font)}
.item .name-in:focus{border-bottom:1.5px solid var(--forest-2)}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:14px;height:42px;overflow:hidden;background:var(--surface-2)}
.stepper button{width:40px;height:100%;display:grid;place-items:center}
.stepper input{width:58px;text-align:center;border:0;background:transparent;font-weight:700;font-family:var(--font-d);font-size:16px;outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.macro-mini{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);font-weight:600}
.macro-mini b{color:var(--ink);font-family:var(--font-d)}
.ntable{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.ntable div{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ntable div span:last-child{font-family:var(--font-d);font-weight:700}
.details{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sticky-save{position:sticky;bottom:calc(10px + var(--safe-b));margin-top:18px;z-index:5}

/* Hoja inferior / modal */
.scrim{position:fixed;inset:0;background:rgba(6,18,12,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;z-index:61;padding:10px 18px calc(22px + var(--safe-b));transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin-bottom:6px}

/* Toast y éxito */
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 26px + var(--safe-b));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:90;opacity:0;transition:all .3s;max-width:calc(100% - 32px);box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--danger);color:#fff}
.success{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 80%, transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:fadeUp .2s}
.success .ok{width:96px;height:96px;border-radius:32px;background:var(--lime);display:grid;place-items:center;margin:0 auto 14px;animation:pop .5s cubic-bezier(.2,.8,.2,1);color:#0F3B2C}
.success .ok svg{width:48px;height:48px;stroke-width:2.6}

/* Splash, bienvenida, auth */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:#0F3B2C;z-index:100;transition:opacity .5s}
.splash .mark{width:96px;height:96px;animation:pop .7s cubic-bezier(.2,.8,.2,1)}
.splash p{color:#C8F169;font-family:var(--font-d);font-weight:700;letter-spacing:.02em;text-align:center;margin-top:16px;animation:fadeUp .8s .2s both}
.splash .w{color:#fff;font-size:30px;font-weight:800;font-family:var(--font-d);letter-spacing:-.03em;text-align:center;animation:fadeUp .7s .1s both}
.welcome{min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + var(--safe-t)) 22px calc(26px + var(--safe-b))}
.welcome .art{flex:1;display:grid;place-items:center;min-height:300px}
.welcome .art .blob{width:min(78vw,300px);aspect-ratio:1;border-radius:42% 58% 60% 40%/45% 45% 55% 55%;background:radial-gradient(circle at 30% 30%,var(--lime),var(--lime-2));display:grid;place-items:center;color:#0F3B2C;box-shadow:var(--shadow-lg);animation:pop .6s}
.welcome .art .blob svg{width:42%;height:42%;stroke-width:1.4}
.welcome h1{font-size:32px;margin-bottom:10px}
.dots{display:flex;gap:6px;margin:22px 0}
.dots i{width:8px;height:8px;border-radius:9px;background:var(--line);transition:all .3s}
.dots i.on{width:26px;background:var(--forest)}
.auth-hero{padding:calc(36px + var(--safe-t)) 22px 32px;background:#0F3B2C;color:#F2F8EE;border-radius:0 0 34px 34px;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;width:300px;height:300px;right:-120px;bottom:-160px;border-radius:50%;background:radial-gradient(circle,rgba(200,241,105,.45),transparent 65%)}
.auth-hero .slogan{font-family:var(--font-d);font-size:34px;font-weight:800;line-height:1.02;letter-spacing:-.03em;margin:26px 0 8px}
.auth-hero .slogan em{font-style:normal;color:#C8F169}

/* Gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);font-size:10px;fill:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.donut-wrap{display:flex;gap:18px;align-items:center}
.donut-wrap svg{width:130px;height:130px;transform:rotate(-90deg);flex-shrink:0}

/* Calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:11px;font-weight:700;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:12px;font-weight:700;font-size:14px;position:relative;font-family:var(--font-d)}
.cal button.other{opacity:.25}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--forest-2)}
.cal button.sel{background:var(--forest);color:var(--bg)}
:root[data-theme="dark"] .cal button.sel{color:#0F3B2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal button.sel{color:#0F3B2C}}
.cal button.has::after{content:"";position:absolute;bottom:6px;left:50%;width:5px;height:5px;border-radius:50%;background:var(--c-protein);transform:translateX(-50%)}
.cal button.sel.has::after{background:var(--lime)}
.cal button[disabled]{opacity:.2}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--surface-2);position:relative}
.gallery img{width:100%;height:100%;object-fit:cover}
.gallery span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:7px}

/* Chat */
.chat{display:flex;flex-direction:column;min-height:calc(100dvh - 140px)}
.msgs{flex:1;display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.bubble{max-width:86%;padding:12px 14px;border-radius:20px;font-size:14.5px;line-height:1.5;animation:fadeUp .25s}
.bubble.me{align-self:flex-end;background:var(--forest);color:var(--bg);border-bottom-right-radius:6px}
:root[data-theme="dark"] .bubble.me{color:#0F3B2C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .bubble.me{color:#0F3B2C}}
.bubble.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.bubble.bot ul{margin:6px 0;padding-left:18px}
.bubble.bot p{margin:0 0 6px}
.bubble.bot p:last-child{margin:0}
.typing{display:flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.composer{position:sticky;bottom:calc(10px + var(--safe-b));display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 6px 6px 14px;box-shadow:var(--shadow-lg)}
.composer textarea{flex:1;border:0;outline:none;background:transparent;resize:none;max-height:120px;padding:10px 0;font-size:16px}
.composer .send{width:44px;height:44px;border-radius:16px;background:var(--lime);color:#0F3B2C;display:grid;place-items:center}
.suggest{display:flex;flex-direction:column;gap:8px}
.suggest button{text-align:left;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;display:flex;gap:10px;align-items:center}

/* Instalación */
.install-banner{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:14px;width:100%;text-align:left}
.install-banner .app-ic{width:44px;height:44px;border-radius:12px;flex-shrink:0}
.install-banner .t{flex:1;min-width:0}
.install-banner .t b{display:block;font-size:14.5px}
.install-banner .t span{font-size:12.5px;color:var(--muted)}
.install-steps{display:grid;gap:10px;margin:14px 0}
.install-steps .st{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.install-steps .n{width:30px;height:30px;border-radius:10px;background:var(--lime);color:#0F3B2C;font-family:var(--font-d);font-weight:800;display:grid;place-items:center;flex-shrink:0}
.install-steps .st p{margin:0;font-size:14px}
.kbd{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap}
.kbd svg{width:15px;height:15px}
.qr{width:180px;height:180px;margin:6px auto;padding:10px;background:#fff;border-radius:18px}
.qr svg{width:100%;height:100%}
.desk-qr{position:fixed;left:24px;bottom:24px;width:230px;z-index:30;text-align:center}
@media (max-width:1100px),(pointer:coarse){.desk-qr{display:none}}
.ios-arrow{position:fixed;left:50%;bottom:calc(8px + var(--safe-b));transform:translateX(-50%);z-index:70;color:var(--lime);animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,8px)}}

/* Perfil */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list .li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .li:last-child{border-bottom:0}
.list .li .ic{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;flex-shrink:0}
.list .li .t{flex:1;min-width:0}
.list .li .t b{display:block;font-size:15px}
.list .li .t span{font-size:12.5px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.acc summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc[open] summary svg{transform:rotate(180deg)}
.acc summary svg{transition:transform .2s}
.acc p{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.empty-state{text-align:center;padding:26px 14px;color:var(--muted)}
.empty-state .ic{width:58px;height:58px;border-radius:20px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 10px}
.skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--line) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:14px}
.hide{display:none!important}
</style>
</head>

"use strict";
/* ════════════════════════════════════════════════════════════
   NutriScan · Eat smart. Live better.
   ════════════════════════════════════════════════════════════ */
const CFG = window.NUTRISCAN_CONFIG || {};
const CLOUD_READY = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase);
const sb = CLOUD_READY ? window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } }) : null;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ic = (n, cls = "") => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
const fmt = (n, d = 0) => (Number(n) || 0).toLocaleString("es-ES", { maximumFractionDigits: d, minimumFractionDigits: 0 });
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
/* ─── Plataforma e instalación ─── */
const UA = navigator.userAgent;
const IS_NATIVE = !!window.Capacitor?.isNativePlatform?.();
const IS_IOS = /iPhone|iPad|iPod/.test(UA) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_ANDROID = /Android/.test(UA);
const IS_MOBILE = IS_IOS || IS_ANDROID;
const IN_APP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|Snapchat|Twitter|LinkedInApp|GSA\//.test(UA);
const IS_STANDALONE = () => IS_NATIVE || matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

const NK = ["kcal", "protein", "carbs", "fat", "sat_fat", "fiber", "sugar", "sodium_mg"];
const NL = { kcal: "Energía", protein: "Proteínas", carbs: "Carbohidratos", fat: "Grasas", sat_fat: "Grasas saturadas", fiber: "Fibra", sugar: "Azúcares", sodium_mg: "Sodio" };
const NU = { kcal: "kcal", protein: "g", carbs: "g", fat: "g", sat_fat: "g", fiber: "g", sugar: "g", sodium_mg: "mg" };
const NC = { protein: "var(--c-protein)", carbs: "var(--c-carbs)", fat: "var(--c-fat)", fiber: "var(--c-fiber)" };
const MEAL_TYPES = { breakfast: "Desayuno", lunch: "Comida", snack: "Merienda", dinner: "Cena" };
const MEAL_ORDER = ["breakfast", "lunch", "snack", "dinner"];
const zero = () => Object.fromEntries(NK.map((k) => [k, 0]));
const itemTotals = (it) => Object.fromEntries(NK.map((k) => [k, ((Number(it.per100g?.[k]) || 0) * (Number(it.grams) || 0)) / 100]));
const sumItems = (items) => items.reduce((t, it) => { const x = itemTotals(it); NK.forEach((k) => (t[k] += x[k])); return t; }, zero());
const sumMeals = (meals) => meals.reduce((t, m) => { NK.forEach((k) => (t[k] += Number(m[k]) || 0)); return t; }, zero());

const dkey = (d) => { const x = new Date(d); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const sameDay = (a, b) => dkey(a) === dkey(b);
const timeStr = (d) => new Date(d).toLocaleTimeString("es-ES", { hour: "2-digit", minute: "2-digit" });
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const longDate = (d) => new Date(d).toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });

const saveLocal = (db) => { if (!store.set(LOCAL_KEY, db)) throw new Error("No queda espacio en este dispositivo. Borra registros antiguos o crea una cuenta."); };
const signed = new Map();

const DB = {
  async getProfile() {
    if (S.mode === "local") return { ...DEFAULT_PROFILE, ...localDB().profile };
    let { data, error } = await sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
    if (error) throw error;
    if (!data) {
      const ins = await sb.from("profiles").insert({ id: S.user.id, display_name: S.user.email?.split("@")[0] }).select().single();
      if (ins.error) throw ins.error;
      data = ins.data;
    }
    return { ...DEFAULT_PROFILE, ...data, settings: data.settings || {} };
  },
  async saveProfile(patch) {
    if (S.mode === "local") { const db = localDB(); db.profile = { ...db.profile, ...patch }; saveLocal(db); return db.profile; }
    const { data, error } = await sb.from("profiles").update(patch).eq("id", S.user.id).select().single();
    if (error) throw error;
    return { ...DEFAULT_PROFILE, ...data };
  },
  async listMeals(from, to) {
    if (S.mode === "local") {
      return localDB().meals.filter((m) => new Date(m.eaten_at) >= from && new Date(m.eaten_at) < to)
        .sort((a, b) => new Date(a.eaten_at) - new Date(b.eaten_at)).map((m) => ({ ...m, photo_url: m.photo_data || null }));
    }
    const { data, error } = await sb.from("meals").select("*").gte("eaten_at", from.toISOString()).lt("eaten_at", to.toISOString()).order("eaten_at");
    if (error) throw error;
    await this.signPhotos(data);
    return data;
  },
  async listAllMeals() {
    if (S.mode === "local") return localDB().meals;
    const { data, error } = await sb.from("meals").select("*").order("eaten_at");
    if (error) throw error;
    return data;
  },
  async signPhotos(meals) {
    const now = Date.now();
    const need = [...new Set(meals.map((m) => m.photo_path).filter((p) => p && !(signed.get(p)?.exp > now + 60000)))];
    if (need.length) {
      const { data } = await sb.storage.from("meal-photos").createSignedUrls(need, 3600);
      (data || []).forEach((d) => d.signedUrl && signed.set(d.path, { url: d.signedUrl, exp: now + 3500 * 1000 }));
    }
    meals.forEach((m) => (m.photo_url = m.photo_path ? signed.get(m.photo_path)?.url || null : null));
  },
  async saveMeal(meal, photoBlob) {
    const row = {
      meal_type: meal.meal_type, eaten_at: new Date(meal.eaten_at).toISOString(), title: meal.title,
      items: meal.items, source: meal.source || "manual", notes: meal.notes || null, ...meal.totals,
    };
    NK.forEach((k) => (row[k] = Math.round((Number(row[k]) || 0) * 10) / 10));
    if (S.mode === "local") {
      const db = localDB();
      if (photoBlob) row.photo_data = await blobToDataURL(await compressImage(photoBlob, 560, 0.7));
      if (meal.id) { const i = db.meals.findIndex((m) => m.id === meal.id); if (i >= 0) db.meals[i] = { ...db.meals[i], ...row }; }
      else db.meals.push({ id: uid(), created_at: new Date().toISOString(), ...row });
      saveLocal(db);
      return;
    }
    if (photoBlob) {
      const path = `${S.user.id}/${uid()}.jpg`;
      const up = await sb.storage.from("meal-photos").upload(path, photoBlob, { contentType: "image/jpeg", upsert: false });
      if (up.error) throw new Error("No se pudo subir la foto: " + up.error.message);
      if (meal.id && meal.photo_path) await sb.storage.from("meal-photos").remove([meal.photo_path]);
      row.photo_path = path;
    }
    const q = meal.id ? sb.from("meals").update(row).eq("id", meal.id) : sb.from("meals").insert(row);
    const { error } = await q;
    if (error) throw error;
  },
  async deleteMeal(meal) {
    if (S.mode === "local") { const db = localDB(); db.meals = db.meals.filter((m) => m.id !== meal.id); saveLocal(db); return; }
    const { error } = await sb.from("meals").delete().eq("id", meal.id);
    if (error) throw error;
    if (meal.photo_path) await sb.storage.from("meal-photos").remove([meal.photo_path]);
  },
  async listWater(from, to) {
    if (S.mode === "local") return localDB().water.filter((w) => new Date(w.logged_at) >= from && new Date(w.logged_at) < to);
    const { data, error } = await sb.from("water_logs").select("*").gte("logged_at", from.toISOString()).lt("logged_at", to.toISOString()).order("logged_at");
    if (error) throw error;
    return data;
  },
  async addWater(ml, at) {
    const logged_at = at.toISOString();
    if (S.mode === "local") { const db = localDB(); db.water.push({ id: uid(), ml, logged_at }); saveLocal(db); return; }
    const { error } = await sb.from("water_logs").insert({ ml, logged_at });
    if (error) throw error;
  },
  async deleteWater(id) {
    if (S.mode === "local") { const db = localDB(); db.water = db.water.filter((w) => w.id !== id); saveLocal(db); return; }
    const { error } = await sb.from("water_logs").delete().eq("id", id);
    if (error) throw error;
  },
};

/* ─── IA (siempre a través de la Edge Function; ninguna clave en el navegador) ─── */
async function ai(action, payload = {}) {
  if (S.mode !== "cloud") throw Object.assign(new Error("La IA necesita una cuenta de NutriScan (modo nube)."), { code: "local_mode" });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw Object.assign(new Error("Sesión caducada. Vuelve a iniciar sesión."), { code: "unauthorized" });
  let r;
  try {
    r = await fetch(`${CFG.SUPABASE_URL}/functions/v1/${CFG.FUNCTION_NAME || "nutriscan-ai"}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${session.access_token}`, apikey: CFG.SUPABASE_ANON_KEY },
      body: JSON.stringify({ action, ...payload }),
    });
  } catch {
    throw Object.assign(new Error("Sin conexión con el servidor de IA. Comprueba tu conexión o que la función esté desplegada."), { code: "network" });
  }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) {
    const msg = r.status === 404 ? "La función de IA aún no está desplegada en Supabase (pendiente de configurar)." : body.message || `Error ${r.status}`;
    throw Object.assign(new Error(msg), { code: body.error || (r.status === 404 ? "not_deployed" : "http_" + r.status) });
  }
  return body;
}
async function refreshAiStatus() {
  if (S.mode !== "cloud") { S.ai = { configured: false, reason: "local" }; return; }
  try { S.ai = await ai("key_status"); }
  catch (e) { S.ai = { configured: false, reason: e.code, message: e.message }; }
}

/* ─── Imagen ─── */
async function compressImage(file, max = 1280, q = 0.82) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch {
    src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  }
  const w = src.width, h = src.height, s = Math.min(1, max / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b), "image/jpeg", q));
}
const blobToDataURL = (b) => new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); });

function toast(msg, type = "") {
  $(".toast")?.remove();

  t.innerHTML = `${ic(type === "err" ? "info" : "check", "s")}<span>${esc(msg)}</span>`;
  document.body.appendChild(t);
  requestAnimationFrame(() => t.classList.add("on"));

function openSheet(html, onMount) {
  closeSheet(true);
  const scrim = document.createElement("div"); scrim.className = "scrim"; scrim.dataset.act = "close-sheet";
  const sh = document.createElement("div"); sh.className = "sheet"; sh.setAttribute("role", "dialog"); sh.setAttribute("aria-modal", "true");
  sh.innerHTML = `<div class="grab"></div>${html}`;
  document.body.append(scrim, sh);
  requestAnimationFrame(() => { scrim.classList.add("on"); sh.classList.add("on"); });
  onMount?.(sh);
  return sh;
}
function closeSheet(instant) {
  const sh = $(".sheet"), sc = $(".scrim");
  if (!sh) return;
  if (instant) { sh.remove(); sc?.remove(); return; }
  sh.classList.remove("on"); sc?.classList.remove("on");
  setTimeout(() => { sh.remove(); sc?.remove(); }, 300);
}
function confirmSheet(title, text, okLabel, danger = true) {

  });
}

function positiveMessage(t, meals, waterMl) {
  const p = S.profile, n = meals.length;
  const foods = new Set(meals.flatMap((m) => (m.items || []).map((i) => i.name?.toLowerCase())));
  if (!n && !waterMl) return "Un nuevo día para cuidarte. Cuando quieras, escanea tu primera comida y empezamos.";
  const bits = [];
  if (n) bits.push(`Llevas ${n} ${n === 1 ? "comida registrada" : "comidas registradas"}`);
  if (foods.size >= 6) bits.push(`con ${foods.size} alimentos distintos: ¡buena variedad!`);
  else if (foods.size >= 3) bits.push(`con ${foods.size} alimentos distintos`);
  let s = bits.join(" ") + (bits.length ? ". " : "");
  if (t.fiber >= p.fiber_goal * 0.7) s += "Tu aporte de fibra va genial. ";
  else if (t.protein >= p.protein_goal * 0.7) s += "Buen aporte de proteínas hoy. ";
  if (waterMl >= p.water_goal_ml) s += "Y has cumplido tu hidratación 💧";
  else if (waterMl > 0) s += n ? `Y ${fmt(waterMl / 1000, 1)} L de agua.` : `Llevas ${fmt(waterMl / 1000, 1)} L de agua.`;
  else s += "Recuerda beber agua cuando te apetezca.";
  return s.trim();
}
function ringHTML(value, goal, label) {
  const r = 60, c = 2 * Math.PI * r, pct = goal ? clamp(value / goal, 0, 1) : 0;
  return `<div class="ring-wrap"><svg viewBox="0 0 140 140"><circle class="track" cx="70" cy="70" r="${r}" fill="none" stroke-width="12"/>
    <circle class="prog" cx="70" cy="70" r="${r}" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}" data-off="${c * (1 - pct)}"/></svg>
    <div class="ring-center"><div><div class="big num">${fmt(value)}</div><div class="xs muted">${label}</div></div></div></div>`;
}
function nutBar(key, val, goal) {
  const pct = goal ? clamp((val / goal) * 100, 0, 100) : 0;
  return `<div class="nut-row"><div class="top-line"><span class="name"><i class="dot" style="background:${NC[key]}"></i>${NL[key]}</span>
    <span class="small"><b class="num" style="font-size:15px">${fmt(val)}</b><span class="muted"> / ${fmt(goal)} g</span></span></div>
    <div class="bar"><i style="background:${NC[key]}" data-w="${pct}"></i></div></div>`;
}
function mealSlotHTML(m) {
  return `<button class="meal-slot" data-act="meal" data-id="${m.id}">
    <div class="ph">${m.photo_url ? `<img src="${esc(m.photo_url)}" alt="" loading="lazy">` : ic("bowl")}</div>
    <div class="meta"><b>${esc(m.title || "Comida")}</b><span class="small muted">${MEAL_TYPES[m.meal_type]} · ${timeStr(m.eaten_at)} · ${(m.items || []).length} alimentos</span></div>

}

async function loadDay(date = new Date()) {
  const from = sod(date), to = addDays(from, 1);
  try {
    const [meals, water] = await Promise.all([DB.listMeals(from, to), DB.listWater(from, to)]);
    S.day = { date: from, meals, water, loaded: true };
  } catch (e) { S.day.loaded = true; toast("No se pudieron cargar tus datos: " + e.message, "err"); }
  if (S.view === "home") rerenderKeepScroll();
}

async function onPhoto(file) {
  if (!file) return;
  if (!/^image\//.test(file.type)) return toast("Ese archivo no es una imagen.", "err");
  let blob;
  try { blob = await compressImage(file); } catch { return toast("No se pudo leer la imagen. Prueba con otra.", "err"); }
  S.draft = { id: null, photoBlob: blob, photo_url: URL.createObjectURL(blob), photo_path: null, items: [], meal_type: S.pendingMealType || autoMealType(), eaten_at: new Date(), title: "", notes: "", source: "manual", fresh: true };
  S.pendingMealType = null;
  if (aiReady()) runAnalysis(); else { render("results"); toast("IA pendiente: añade los alimentos manualmente.", ""); }
}
const STEPS = ["Identificando alimentos", "Estimando porciones", "Calculando nutrientes", "Consultando base de datos"];

afterRender.analyzing = () => {
  let i = 0; clearInterval(stepTimer);
  stepTimer = setInterval(() => {
    i = Math.min(i + 1, STEPS.length - 1);
    $$("[data-step]").forEach((el) => { const k = +el.dataset.step; el.className = "s " + (k < i ? "done" : k === i ? "on" : ""); });
  }, 4200);
};
let analysisToken = 0;
async function runAnalysis() {
  const token = ++analysisToken;
  render("analyzing");
  try {
    const dataUrl = await blobToDataURL(S.draft.photoBlob);
    const res = await ai("analyze", { image_base64: dataUrl.split(",")[1], media_type: "image/jpeg" });
    if (token !== analysisToken) return;
    clearInterval(stepTimer);
    if (!res.is_food) {
      S.draft.notes = res.notes;
      render("results");
      toast("No hemos detectado comida en la foto. Puedes añadir alimentos a mano.", "err");
      return;
    }
    Object.assign(S.draft, { items: res.items, title: res.dish_name || "", notes: res.notes || "", source: "ai" });
    render("results");
  } catch (e) {
    if (token !== analysisToken) return;
    clearInterval(stepTimer);
    render("results");
    openSheet(`<h2>No se pudo analizar</h2><p class="muted">${esc(e.message)}</p>
      <div class="grid2" style="margin-top:16px"><button class="btn ghost" data-act="close-sheet">Añadir a mano</button><button class="btn primary" data-act="retry-analysis">${ic("refresh", "s")} Reintentar</button></div>

    if (e.code === "no_key" || e.code === "bad_key") refreshAiStatus();
  }
}

function barChart(series, goal, color, unit = "") {
  const W = 320, H = 150, pad = 18, n = series.length, max = Math.max(goal || 0, ...series.map((s) => s.v), 1) * 1.12;
  const bw = Math.max(3, (W - pad) / n * 0.62), step = (W - pad) / n;
  const y = (v) => H - 22 - (v / max) * (H - 34);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico">`;
  if (goal) s += `<line x1="0" x2="${W}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--muted)" stroke-dasharray="4 4" stroke-width="1" opacity=".6"/><text x="${W}" y="${y(goal) - 4}" text-anchor="end">${fmt(goal)}${unit}</text>`;
  series.forEach((p, i) => {
    const x = pad / 2 + i * step + (step - bw) / 2, h = Math.max(p.v ? 3 : 0, H - 22 - y(p.v));
    s += `<rect x="${x}" y="${H - 22 - h}" width="${bw}" height="${h}" rx="${Math.min(6, bw / 2)}" fill="${color}" opacity="${p.v ? 1 : .25}"><title>${p.title}: ${fmt(p.v)}${unit}</title></rect>`;
    if (n <= 7 || i % 5 === 0 || i === n - 1) s += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${p.label}</text>`;
  });
  return s + `</svg>`;
}
function donut(parts) {
  const r = 50, c = 2 * Math.PI * r, total = parts.reduce((a, p) => a + p.v, 0) || 1;
  let acc = 0;
  return `<svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="16"/>${parts.map((p) => {
    const len = (p.v / total) * c, seg = `<circle cx="60" cy="60" r="${r}" fill="none" stroke="${p.color}" stroke-width="16" stroke-dasharray="${Math.max(0, len - 2)} ${c}" stroke-dashoffset="${-acc}"/>`;
    acc += len; return seg;
  }).join("")}</svg>`;
}

function mdLite(s) {
  const lines = esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split("\n");
  let out = "", inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-•*]|\d+\.)\s+(.*)/);
    if (m) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${m[1]}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (l.trim()) out += `<p>${l.replace(/^#+\s*/, "")}</p>`;
  }
  return out + (inList ? "</ul>" : "");
}

function suggestGoals(p) {
  if (isProtected() || !p.age || !p.weight_kg || !p.height_cm || !p.sex) return null;
  const w = +p.weight_kg, h = +p.height_cm, a = +p.age;
  const bmr = 10 * w + 6.25 * h - 5 * a + (p.sex === "male" ? 5 : p.sex === "female" ? -161 : -78);
  const tdee = bmr * ({ sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, very_active: 1.9 }[p.activity] || 1.55);
  let kcal = p.goal === "gain" ? tdee * 1.1 : p.goal === "lose_gradual" ? Math.max(tdee * 0.88, bmr * 1.15, 1500) : tdee;
  kcal = Math.round(kcal / 50) * 50;
  const protein = Math.round(w * (p.goal === "gain" ? 1.6 : p.goal === "lose_gradual" ? 1.4 : 1.1));
  const fat = Math.round((kcal * 0.3) / 9), carbs = Math.max(130, Math.round((kcal - protein * 4 - fat * 9) / 4));
  return { kcal_goal: kcal, protein_goal: protein, carbs_goal: carbs, fat_goal: fat, fiber_goal: Math.max(25, Math.round((kcal / 1000) * 14)), water_goal_ml: clamp(Math.round((w * 33) / 250) * 250, 1500, 3500) };
}

view.addEventListener("change", onProfileChange);
async function onProfileChange(e) {
  const el = e.target;
  if (S.view !== "profile") return;
  if (el.dataset.p) {
    const k = el.dataset.p;
    let v = el.type === "checkbox" ? el.checked : el.value;
    if (["age", "kcal_goal", "protein_goal", "carbs_goal", "fat_goal", "fiber_goal", "water_goal_ml"].includes(k)) v = v === "" ? null : Math.round(Number(v));
    if (["weight_kg", "height_cm"].includes(k)) v = v === "" ? null : Number(v);
    if (k === "sex" && !v) v = null;
    if (k === "age" && v != null && (v < 14 || v > 120)) return toast("La edad debe estar entre 14 y 120.", "err");
    if (k.endsWith("_goal") && k !== "water_goal_ml" && (v == null || v < 0)) return toast("Introduce un número válido.", "err");
    if (k === "kcal_goal" && (v < 800 || v > 6000)) return toast("El objetivo de energía debe estar entre 800 y 6000 kcal.", "err");
    await saveProfile({ [k]: v }, ["age", "medical_flag"].includes(k));
  } else if (el.dataset.notif) {
    const n = { ...(S.profile.settings?.notifications || {}) };
    n[el.dataset.notif] = el.type === "checkbox" ? el.checked : el.value;
    await saveProfile({ settings: { ...S.profile.settings, notifications: n } });
  } else if (el.dataset.actChange === "theme") {
    store.set("ns_theme", el.value); applyTheme();
  } else if (el.dataset.actChange === "notif") {
    if (el.checked) {
      if (!("Notification" in window)) { el.checked = false; return toast("Este navegador no admite notificaciones.", "err"); }
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { el.checked = false; return toast("Permiso de notificaciones denegado.", "err"); }
    }
    const n = { breakfast: "08:30", lunch: "14:00", dinner: "21:00", water: false, ...(S.profile.settings?.notifications || {}), enabled: el.checked };
    await saveProfile({ settings: { ...S.profile.settings, notifications: n } }, true);
  }
}
async function saveProfile(patch, rerender = false) {

}

    a.download = `nutriscan-datos-${dkey(new Date())}.json`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast("Datos descargados");
  } catch (e) { toast("No se pudo exportar: " + e.message, "err"); }
}
async function deleteAccount() {
  const local = S.mode === "local";
  if (!(await confirmSheet(local ? "¿Borrar los datos de este dispositivo?" : "¿Eliminar tu cuenta?", local ? "Se borrarán perfil, comidas y fotos guardadas en este navegador." : "Se borrarán para siempre tu cuenta, comidas, fotos, agua y la clave de Claude. No se puede deshacer.", "Eliminar definitivamente"))) return;
  try {
    if (local) { store.del(LOCAL_KEY); store.del("ns_mode"); store.del(chatKey()); location.reload(); return; }
    await ai("delete_account");
    store.del(chatKey()); await sb.auth.signOut(); toast("Cuenta eliminada");
  } catch (e) { toast(e.code === "not_deployed" ? "Para eliminar la cuenta hace falta la función del servidor desplegada." : e.message, "err"); }
}

/* ════════════════ Instalación en el móvil ════════════════ */
function installBanner() {
  if (IS_STANDALONE() || !IS_MOBILE) return "";
  if (Date.now() - store.get("ns_install_dismissed", 0) < 7 * 864e5) return "";
  return `<div class="install-banner"><svg class="app-ic"><use href="#logo"/></svg>
    <div class="t"><b>Instala NutriScan en tu ${IS_IOS ? "iPhone" : "móvil"}</b><span>Gratis y sin tiendas, en 10 segundos</span></div>
    <button class="btn lime sm" data-act="install">Instalar</button>
    <button class="icon-btn sm" style="border:0;background:transparent" data-act="install-dismiss" aria-label="Ahora no">${ic("close", "s")}</button></div>`;
}
const stepsHTML = (arr) => `<div class="install-steps">${arr.map((t, i) => `<div class="st"><span class="n">${i + 1}</span><p>${t}</p></div>`).join("")}</div>`;
function loadScript(src) {
  return new Promise((res, rej) => { const el = document.createElement("script"); el.src = src; el.onload = res; el.onerror = rej; document.head.appendChild(el); });
}
async function renderQR(el, url) {
  if (!el) return;
  try {
    if (!window.qrcode) await loadScript("https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js");
    const q = window.qrcode(0, "M"); q.addData(url); q.make();
    el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 0, scalable: true, alt: "Código QR para abrir NutriScan en el móvil" });
  } catch { el.innerHTML = `<p class="xs muted" style="color:#333">No se pudo generar el QR.</p>`; }
}
function openInstall(tab) {

    body += stepsHTML([

      `Desliza hacia abajo y elige <span class="kbd">${ic("plus-sq")} Añadir a pantalla de inicio</span>.`,

    else body += stepsHTML([
      `Abre este enlace en <b>Chrome</b> (o Samsung Internet).`,
      `Toca el menú <span class="kbd">${ic("dots")}</span> arriba a la derecha.`,

  }

  openSheet(`<div class="row" style="gap:12px"><svg style="width:52px;height:52px;flex-shrink:0"><use href="#logo"/></svg><div><h2 style="margin:0">Instalar NutriScan</h2><p class="small muted" style="margin:0">Pantalla completa, icono propio y la cámara a un toque.</p></div></div>

    <button class="btn ghost block" style="margin-top:12px" data-act="share-app">${ic("share", "s")} Compartir enlace</button>`,
    (sh) => qrBlock && renderQR($(".qr", sh), WEB_URL));

async function shareApp() {
  const url = WEB_URL || CFG.APP_URL;
  if (!url) return toast("Configura APP_URL en config.js para compartir el enlace.", "err");
  const data = { title: "NutriScan", text: "NutriScan · Eat smart. Live better. Fotografía tu plato y conoce sus nutrientes.", url };
  try {
    if (navigator.share) await navigator.share(data);
    else { await navigator.clipboard.writeText(url); toast("Enlace copiado"); }
  } catch (e) { if (e?.name !== "AbortError") toast("No se pudo compartir.", "err"); }

function desktopQR() {
  if (IS_MOBILE || IS_NATIVE || !WEB_URL || !matchMedia("(pointer:fine) and (min-width:1101px)").matches) return;
  const el = document.createElement("div");
  el.className = "desk-qr card";
  el.innerHTML = `<p class="eyebrow" style="margin:0 0 6px">NutriScan es para el móvil</p><div class="qr"></div><p class="small muted" style="margin:6px 0 0">Escanéalo con la cámara de tu iPhone o Android e instálala.</p>`;
  document.body.appendChild(el);
  renderQR($(".qr", el), WEB_URL);
}

/* ════════════════ Recordatorios ════════════════ */
function startReminders() {
  setInterval(async () => {
    const n = S.profile?.settings?.notifications;
    if (!n?.enabled || !("Notification" in window) || Notification.permission !== "granted") return;
    const now = new Date(), hm = now.toTimeString().slice(0, 5), today = dkey(now);
    const fired = store.get("ns_fired", {});
    const fire = async (id, title, body) => {
      if (fired[id] === today) return;
      fired[id] = today; store.set("ns_fired", fired);
      const reg = await navigator.serviceWorker?.getRegistration?.();
      if (reg) reg.showNotification(title, { body, icon: "icons/icon-192.png", badge: "icons/icon-192.png", tag: id });
      else new Notification(title, { body, icon: "icons/icon-192.png" });
    };
    for (const k of MEAL_ORDER) if (n[k] && n[k] === hm) fire("meal_" + k, "NutriScan", `¿Qué tal tu ${MEAL_TYPES[k].toLowerCase()}? Escanéala en un momento 📸`);
    if (n.water && now.getMinutes() === 0 && now.getHours() >= 9 && now.getHours() <= 21 && now.getHours() % 2 === 1) fire("water_" + now.getHours(), "NutriScan", "Un vaso de agua cuando te apetezca 💧");
  }, 30000);
}

/* ════════════════ Acciones ════════════════ */
const ACT = {
  "tab": (el) => { S.tab = el.dataset.tab; render(S.tab); if (S.tab === "history" && !S.hist.loaded) loadMonth(); if (S.tab === "nutrition" && !S.nut.loaded) loadNut(); if (S.tab === "home" && !S.day.loaded) loadDay(); },
  "close-sheet": () => closeSheet(),
  "local-mode": () => { store.set("ns_mode", "local"); startLocal(); },
  "go-auth": () => {
    closeSheet(true);
    if (!CLOUD_READY) return toast("La base de datos en la nube aún no está configurada (config.js).", "err");
    store.del("ns_mode"); S.mode = null; authMode = "register"; render("auth");
  },
  "welcome-next": () => { if (S.welcomeStep < WELCOME.length - 1) { S.welcomeStep++; render("welcome"); } else finishWelcome(); },
  "welcome-skip": () => finishWelcome(),
  "auth-mode": (el) => { authMode = el.dataset.m; render("auth"); },
  "forgot": () => openSheet(`<h2>Recuperar contraseña</h2><p class="muted small">Te enviaremos un enlace para crear una nueva.</p><div class="field"><input class="input" id="fp-email" type="email" placeholder="tu@email.com" value="${esc($("#a-email")?.value || "")}"></div><button class="btn primary block" id="fp-go">Enviar enlace</button>`, (sh) => {
    $("#fp-go", sh).onclick = async () => {
      const { error } = await sb.auth.resetPasswordForEmail($("#fp-email", sh).value.trim(), { redirectTo: WEB_URL || undefined });
      if (error) return toast(error.message, "err");
      closeSheet(); toast("Revisa tu correo");
    };
  }),
  "privacy": (el, e) => { e.preventDefault(); privacySheet(); },
  "chip1": (el) => { const g = el.closest("[data-group]").dataset.group; S.profile[g] = el.dataset.v; $$(".chip", el.parentNode).forEach((c) => c.classList.toggle("on", c === el)); },
  "chipN": (el) => {
    const g = el.closest("[data-group]").dataset.group, v = el.dataset.v, arr = new Set(S.profile[g] || []);
    arr.has(v) ? arr.delete(v) : arr.add(v);
    el.classList.toggle("on");
    if (el.dataset.save) saveProfile({ [g]: [...arr] }); else S.profile[g] = [...arr];
  },
  "ob-prev": () => { S.onboardStep--; render("onboard"); },
  "ob-next": async () => {
    if (S.onboardStep === 0) {
      const age = $("#o-age").value ? Math.round(+$("#o-age").value) : null;
      if (age != null && (age < 14 || age > 120)) return toast("NutriScan es para personas de 14 años o más.", "err");
      Object.assign(S.profile, { display_name: $("#o-name").value.trim(), age, medical_flag: $("#o-med").checked });
      if (isProtected() && S.profile.goal === "lose_gradual") S.profile.goal = "health";
    }
    const total = S.mode === "cloud" ? 4 : 3;
    if (S.onboardStep < total - 1) { S.onboardStep++; render("onboard"); return; }
    const p = S.profile;
    const patch = { display_name: p.display_name, age: p.age, medical_flag: p.medical_flag, activity: p.activity, goal: p.goal, diet_prefs: p.diet_prefs, allergies: p.allergies, onboarded: true };
    await saveProfile(patch);
    S.tab = "home"; render("home"); loadDay();
    if (isProtected()) setTimeout(() => toast("Te recomendamos fijar tus objetivos con un profesional sanitario."), 1500);
  },
  "water-add": async (el) => { try { await DB.addWater(+el.dataset.ml, new Date()); invalidate(); await loadDay(); toast("+" + el.dataset.ml + " ml de agua 💧"); } catch (e) { toast(e.message, "err"); } },
  "water-undo": async () => { const last = S.day.water.at(-1); if (!last) return toast("Aún no has registrado agua hoy."); try { await DB.deleteWater(last.id); invalidate(); await loadDay(); } catch (e) { toast(e.message, "err"); } },
  "scan-for": (el) => { S.pendingMealType = el.dataset.mt; S.tab = "scan"; render("scan"); },
  "pick": (el) => { const inp = $(el.dataset.src === "camera" ? "#in-camera" : "#in-gallery"); inp.value = ""; inp.click(); },
  "manual": () => { S.draft = { id: null, photoBlob: null, photo_url: null, items: [], meal_type: S.pendingMealType || autoMealType(), eaten_at: new Date(), title: "", notes: "", source: "manual" }; S.pendingMealType = null; render("results"); addItemSheet(); },
  "add-past": () => { const d = new Date(S.hist.sel); d.setHours(13, 0, 0, 0); S.draft = { id: null, photoBlob: null, photo_url: null, items: [], meal_type: "lunch", eaten_at: d, title: "", notes: "", source: "manual" }; render("results"); },
  "cancel-analysis": () => { analysisToken++; clearInterval(stepTimer); S.draft = null; render("scan"); },
  "retry-analysis": () => { closeSheet(true); runAnalysis(); },
  "discard": async () => {
    if (!S.draft?.id && S.draft?.items.length && !(await confirmSheet("¿Descartar este registro?", "Perderás los alimentos identificados.", "Descartar"))) return;
    S.draft = null; render(S.tab);
  },
  "add-item": () => addItemSheet(),
  "del-item": (el) => { S.draft.items.splice(+el.closest(".item").dataset.i, 1); rerenderKeepScroll(); },
  "grams": (el) => { const it = S.draft.items[+el.closest(".item").dataset.i]; it.grams = clamp(Math.round((Number(it.grams) || 0) + +el.dataset.d), 1, 3000); $("[data-field='grams']", el.closest(".item")).value = it.grams; refreshDraftNumbers(); },
  "recalc-item": async (el) => {
    const it = S.draft.items[+el.closest(".item").dataset.i];
    el.innerHTML = `<span class="spinner" style="width:14px;height:14px;border-width:2px"></span>`;
    try { const r = await ai("lookup", { name: it.name }); Object.assign(it, { per100g: r.per100g, source: r.source, confidence: null, _renamed: false }); rerenderKeepScroll(); toast("Nutrientes recalculados"); }
    catch (e) { toast(e.message, "err"); rerenderKeepScroll(); }
  },
  "draft-type": (el) => { S.draft.meal_type = el.dataset.v; $$("[data-act='draft-type']").forEach((c) => c.classList.toggle("on", c === el)); },
  "save-meal": () => saveDraft(),
  "meal": (el) => { const m = findMeal(el.dataset.id); if (m) mealSheet(m); },
  "edit-meal": (el) => {
    const m = findMeal(el.dataset.id); closeSheet(true);

    render("results");
  },
  "del-meal": async (el) => {

    if (!(await confirmSheet("¿Eliminar esta comida?", "Se borrará el registro y su foto.", "Eliminar"))) return;
    try { await DB.deleteMeal(m); invalidate(); toast("Comida eliminada"); await loadDay(); if (S.view === "history") loadMonth(); if (S.view === "nutrition") loadNut(); } catch (e) { toast(e.message, "err"); }
  },
  "hist-month": (el) => { const m = S.hist.month; S.hist.month = new Date(m.getFullYear(), m.getMonth() + +el.dataset.d, 1); S.hist.sel = S.hist.month; S.hist.loaded = false; render("history"); loadMonth(); },
  "hist-day": (el) => { const [y, mo, d] = el.dataset.d.split("-").map(Number); S.hist.sel = new Date(y, mo - 1, d); rerenderKeepScroll(); },
  "hist-mode": (el) => { S.hist.mode = el.dataset.m; rerenderKeepScroll(); },
  "nut-period": (el) => { S.nut.period = el.dataset.p; S.nut.loaded = false; render("nutrition"); loadNut(); },
  "open-chat": () => { render("chat"); },
  "back-from-chat": () => render(S.tab),
  "chat-suggest": (el) => sendChat(el.dataset.q),
  "chat-clear": async () => { if (await confirmSheet("¿Borrar la conversación?", "Se eliminará el historial de este chat en este dispositivo.", "Borrar")) { S.chat = []; store.del(chatKey()); render("chat"); } },
  "claude-sheet": () => { closeSheet(true); openSheet(claudeConnectHTML(), () => afterRender.claude()); },
  "suggest-goals": async () => {
    const g = suggestGoals(S.profile); if (!g) return;
    if (!(await confirmSheet("Objetivos sugeridos", `Energía ${fmt(g.kcal_goal)} kcal · Proteínas ${g.protein_goal} g · Carbohidratos ${g.carbs_goal} g · Grasas ${g.fat_goal} g · Fibra ${g.fiber_goal} g · Agua ${fmt(g.water_goal_ml)} ml. Es una estimación orientativa (Mifflin-St Jeor). ¿Aplicarla?`, "Aplicar", false))) return;
    await saveProfile(g, true);
  },
  "replay-tutorial": () => { S.welcomeStep = 0; S.replay = true; render("welcome"); },
  "privacy-sheet": () => privacySheet(),
  "export": () => exportData(),
  "logout": async () => { if (await confirmSheet("¿Cerrar sesión?", "Tus datos seguirán guardados en tu cuenta.", "Cerrar sesión", false)) await sb.auth.signOut(); },
  "delete-account": () => deleteAccount(),
  "install": (el) => openInstall(el.dataset.tab),
  "install-dismiss": (el) => { store.set("ns_install_dismissed", Date.now()); el.closest(".install-banner")?.remove(); },
  "install-native": async () => {
    if (!installPrompt) return;
    closeSheet();
    installPrompt.prompt();
    const { outcome } = await installPrompt.userChoice.catch(() => ({}));
    installPrompt = null;
    if (outcome === "dismissed") toast("Puedes instalarla cuando quieras desde Perfil.");

};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) { if (el.tagName === "A") e.preventDefault(); fn(el, e); }
});
$("#in-camera").onchange = (e) => onPhoto(e.target.files[0]);
$("#in-gallery").onchange = async (e) => {
  const f = e.target.files[0];
  if (S.view === "results" && S.draft && !S.draft.photo_url && f) {
    try { S.draft.photoBlob = await compressImage(f); S.draft.photo_url = URL.createObjectURL(S.draft.photoBlob); rerenderKeepScroll(); } catch { toast("No se pudo leer la imagen.", "err"); }
    return;
  }
  onPhoto(f);
};
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* ════════════════ Arranque ════════════════ */
function applyTheme() {
  const t = store.get("ns_theme", "auto");
  if (t === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", t);
  const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  $('meta[name="theme-color"]').content = dark ? "#0A110D" : "#0F3B2C";
}
function finishWelcome() {
  store.set("ns_welcomed", true);
  if (S.replay) { S.replay = false; S.tab = "profile"; render("profile"); return; }
  boot();
}
async function enterApp() {
  try { S.profile = await DB.getProfile(); }
  catch (e) {
    S.profile = { ...DEFAULT_PROFILE };
    toast(/relation|does not exist|schema/i.test(e.message) ? "La base de datos no tiene las tablas de NutriScan: ejecuta la migración SQL." : "No se pudo cargar tu perfil: " + e.message, "err");
  }
  S.chat = store.get(chatKey(), []);
  await refreshAiStatus();
  if (!S.profile.onboarded) { S.onboardStep = 0; render("onboard"); return; }
  const params = new URLSearchParams(location.search);
  const startScan = params.get("action") === "scan";
  if (params.has("action")) history.replaceState(null, "", location.pathname);
  S.tab = startScan ? "scan" : "home"; S.day.loaded = false; render(S.tab); loadDay();
}
function startLocal() { S.mode = "local"; S.user = null; S.hist.loaded = S.nut.loaded = false; enterApp(); }
let booted = false;
async function boot() {
  if (!store.get("ns_welcomed", false)) { render("welcome"); return; }
  if (store.get("ns_mode") === "local") return startLocal();
  if (!CLOUD_READY) return render("setup");
  const { data: { session } } = await sb.auth.getSession();
  if (session) { S.mode = "cloud"; S.user = session.user; return enterApp(); }
  render("auth");
}
if (sb) {
  sb.auth.onAuthStateChange((event, session) => {
    if (!booted || store.get("ns_mode") === "local") return;
    if (event === "SIGNED_IN" && session && S.user?.id !== session.user.id) { S.mode = "cloud"; S.user = session.user; invalidate(); S.day = { date: sod(new Date()), meals: [], water: [], loaded: false }; enterApp(); }
    if (event === "SIGNED_OUT") { S.mode = null; S.user = null; S.profile = null; S.chat = []; signed.clear(); authMode = "login"; render("auth"); }
    if (event === "PASSWORD_RECOVERY") {
      openSheet(`<h2>Nueva contraseña</h2><div class="field"><input class="input" id="np" type="password" minlength="8" placeholder="Mínimo 8 caracteres" autocomplete="new-password"></div><button class="btn primary block" id="np-go">Guardar</button>`, (sh) => {
        $("#np-go", sh).onclick = async () => { const { error } = await sb.auth.updateUser({ password: $("#np", sh).value }); if (error) return toast(error.message, "err"); closeSheet(); toast("Contraseña actualizada"); };
      });
    }
  });
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.profile && !sameDay(S.day.date, new Date())) { S.day.loaded = false; loadDay(); }
});

(function splash() {
  applyTheme();
  matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", applyTheme);
  const sp = document.createElement("div");
  sp.className = "splash";
  sp.innerHTML = `<div><svg class="mark" style="display:block;margin:0 auto 18px"><use href="#logo"/></svg><div class="w">NutriScan</div><p>Eat smart. Live better.</p></div>`;
  document.body.appendChild(sp);
  const start = Date.now();
  boot().catch((e) => { console.error(e); toast("Error al iniciar: " + e.message, "err"); }).finally(() => {
    booted = true;
    setTimeout(() => { sp.style.opacity = 0; setTimeout(() => sp.remove(), 500); }, Math.max(0, 1100 - (Date.now() - start)));
  });
  startReminders();
  if (!IS_NATIVE && "serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  desktopQR();
})();
